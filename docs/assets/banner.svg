<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-labelledby="t d">
  <title id="t">design-divergent</title>
  <desc id="d">From one starting point, the default proposal goes straight to a grey dot and is struck out, while four coloured paths fan out to four different shapes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14161c"/>
      <stop offset="1" stop-color="#22273a"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="320" fill="url(#bg)"/>

  <!-- le défaut : tout droit vers l'attracteur, puis barré -->
  <g stroke="#6b7080" fill="none" stroke-width="2">
    <line x1="66" y1="160" x2="258" y2="160" stroke-dasharray="4 7"/>
    <circle cx="272" cy="160" r="11"/>
    <line x1="257" y1="175" x2="287" y2="145" stroke="#9a9fae" stroke-width="2.5"/>
  </g>

  <!-- quatre mandats, quatre angles, quatre formes -->
  <g fill="none" stroke-width="3" stroke-linecap="round">
    <path d="M60 160 C 120 110, 250 46, 414 46" stroke="#e07a5f"/>
    <path d="M60 160 C 140 128, 290 118, 426 118" stroke="#3d9a8b"/>
    <path d="M60 160 C 140 192, 290 202, 426 202" stroke="#e9c46a"/>
    <path d="M60 160 C 120 210, 250 274, 414 274" stroke="#8d7bd8"/>
  </g>
  <circle cx="428" cy="46" r="13" fill="#e07a5f"/>
  <rect x="428" y="106" width="24" height="24" fill="#3d9a8b"/>
  <polygon points="440,188 454,214 426,214" fill="#e9c46a"/>
  <polygon points="428,258 444,274 428,290 412,274" fill="#8d7bd8"/>
  <circle cx="60" cy="160" r="7" fill="#f2ede3"/>

  <g font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="520" y="148" font-size="66" font-weight="700" fill="#f2ede3" letter-spacing="-1">design-divergent</text>
    <text x="523" y="196" font-size="27" fill="#d3cdbf" font-style="italic">Vary the brief, not the model.</text>
    <text x="523" y="236" font-size="20" fill="#8e8a80">A Claude Code skill for design proposals that really differ.</text>
  </g>
</svg>
